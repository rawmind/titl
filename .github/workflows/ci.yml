name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: titl-extension
          path: dist/*.zip

  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: titl-${{ runner.os }}
          path: |
            helper/target/release/titl
            helper/target/release/titl.exe
          if-no-files-found: error

  end-to-end:
    needs: helper
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: titl-${{ runner.os }}
          path: bin

      - name: Download test clip
        run: curl -sfL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav

      - name: titl install
        run: |
          chmod +x bin/titl* || true
          mkdir -p ~/.config/google-chrome
          bin/titl* install --download-model tiny < /dev/null
          bin/titl* status
          bin/titl* --version

      - name: Check browser registration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = (Get-ItemProperty 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.chrome_transcriber.host').'(default)'
          Write-Output "registry -> $manifest"
          "MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check browser registration (Linux)
        if: runner.os == 'Linux'
        run: |
          manifest=~/.config/google-chrome/NativeMessagingHosts/com.chrome_transcriber.host.json
          test -f "$manifest"
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: install.ps1 downloads, verifies and installs the helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item bin/titl.exe release/titl-windows-x64.exe
          $hash = (Get-FileHash release/titl-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  titl-windows-x64.exe" | Out-File -FilePath release/SHA256SUMS -Encoding ascii
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', 'release' -PassThru
          Start-Sleep -Seconds 2
          try {
            $env:TITL_RELEASE_URL = 'http://127.0.0.1:8765'
            ./scripts/install.ps1 --download-model tiny
          } finally {
            Stop-Process -Id $server.Id
          }

      - name: Start whisper-server through the helper and transcribe
        run: python scripts/host-smoke.py "$MANIFEST" jfk.wav en "fellow Americans"

      - name: Server log on failure
        if: failure()
        run: |
          ls -R ~/.local/share/chrome-transcriber 2>/dev/null | head -50 || true
          cat ~/.local/share/chrome-transcriber/server.log 2>/dev/null || true
          cat "$LOCALAPPDATA/chrome-transcriber/server.log" 2>/dev/null || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, helper, end-to-end]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/install.ps1
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Name binaries for download
        run: |
          mkdir out
          cp src/scripts/install.ps1 out/install.ps1
          cp artifacts/titl-Windows/titl.exe out/titl-windows-x64.exe
          cp artifacts/titl-macOS/titl out/titl-macos-arm64
          cp artifacts/titl-Linux/titl out/titl-linux-x64
          chmod +x out/titl-macos-arm64 out/titl-linux-x64
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Wait for the GitHub release
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "release $TAG was not created within 15 minutes" >&2
          exit 1
      - name: Attach binaries to the release
        run: gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber

  chrome-web-store:
    if: startsWith(github.ref, 'refs/tags/v') && vars.CWS_SERVICE_ACCOUNT != ''
    needs: [extension, helper, end-to-end]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      API: https://chromewebstore.googleapis.com
      ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/bpapgchpopccpbgbkfldmdmfmddgoeme
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: titl-extension
      - name: Check the package matches the tag
        run: |
          ZIP="titl-${GITHUB_REF_NAME#v}.zip"
          test -f "$ZIP" || { ls; echo "$ZIP not found" >&2; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload to the Chrome Web Store
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          state=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
            -T "$ZIP" "$API/upload/v2/$ITEM:upload" | tee /dev/stderr | jq -r .uploadState)
          for _ in $(seq 40); do
            case "$state" in
              SUCCEEDED) exit 0 ;;
              IN_PROGRESS|UPLOAD_IN_PROGRESS) sleep 15 ;;
              *) echo "upload state: $state" >&2; exit 1 ;;
            esac
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
              "$API/v2/$ITEM:fetchStatus" | tee /dev/stderr | jq -r .lastAsyncUploadState)
          done
          echo "upload still processing after 10 minutes" >&2
          exit 1
