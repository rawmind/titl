[package]
name = "titl"
version = "0.1.18"
edition = "2021"
license = "MIT"
description = "Installs and runs whisper-server for the Titl extension"

[dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
