<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="../icons/icon48.png" width="28" height="28" alt="">
    <h1>Titl</h1>
    <span class="bars" aria-hidden="true"></span>
  </header>

  <p id="status" class="status"><span class="dot"></span><span id="statusText">Idle</span></p>

  <button id="toggle" class="cta">
    <span class="cta-icon" aria-hidden="true"></span>
    <span id="toggleLabel" data-i18n="startSubtitles">Start subtitles</span>
  </button>

  <p class="footer">
    <span id="server"></span>
    <a href="#" id="options" data-i18n="settings">Settings</a>
  </p>

  <script type="module" src="popup.js"></script>
</body>
</html>
