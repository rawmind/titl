<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="../icons/icon48.png" width="28" height="28" alt="">
    <h1>Titl</h1>
    <span class="bars" aria-hidden="true"></span>
  </header>

  <p id="status" class="status"><span class="dot"></span><span id="statusText">Idle</span></p>

  <button id="toggle" class="cta">
    <span class="cta-icon" aria-hidden="true"></span>
    <span id="toggleLabel" data-i18n="startSubtitles">Start subtitles</span>
  </button>

  <section id="update" class="update" hidden>
    <p id="updateText" class="update-text"></p>
    <ul id="updateNotes" class="update-notes"></ul>
    <p class="update-actions">
      <button id="updateButton" class="secondary" data-i18n="updateHelper">Update</button>
      <a id="updateNotesLink" target="_blank" rel="noopener" data-i18n="releaseNotes">Release notes</a>
    </p>
  </section>

  <footer class="footer">
    <dl class="langs">
      <dt data-i18n="spokenLanguage">Spoken language</dt>
      <dd id="spoken" class="value"></dd>
      <dt><label for="target" data-i18n="translateTo">Translate to</label></dt>
      <dd>
        <select id="target">
          <option value="" data-i18n="off">Off</option>
        </select>
      </dd>
    </dl>
    <a href="#" id="options" data-i18n="settings">Settings</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
